<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>window.BAGU_STATIC = true;</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>请选择学习模块</title>
  <style>
    :root {
      --green: #58CC02;
      --green-dark: #46A302;
      --green-soft: #E7F8D9;
      --blue: #1CB0F6;
      --blue-dark: #1899D6;
      --ink: #3C3C3C;
      --muted: #777;
      --line: #E5E5E5;
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-width: 1100px;
    }

    .picker {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 64px;
    }
    .picker-inner { width: 100%; max-width: 880px; }
    .picker h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .picker .lead {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .module-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 2px solid #CDE9B0;
      border-radius: var(--radius);
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
      min-height: 180px;
    }
    .module-card:hover {
      border-color: var(--green);
      transform: translateY(-1px);
    }
    .module-name {
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .module-name span { color: var(--green); }
    .module-sub {
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }
    .module-count {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 700;
      color: #3A7D00;
      min-height: 1.2em;
    }

    .contact-box {
      margin-top: 36px;
      max-width: 360px;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
    }
    .contact-box .contact-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .contact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 6px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }
    .contact-btn:hover { border-color: var(--blue); color: var(--blue-dark); }
    .contact-btn svg { width: 16px; height: 16px; flex-shrink: 0; display: block; }
    button.contact-btn { font: inherit; cursor: pointer; }
    .contact-wechat { position: relative; }
    .wechat-qr {
      display: none;
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      padding: 8px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 50;
      pointer-events: none;
    }
    .wechat-qr img {
      width: 168px;
      height: 168px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }
    .contact-wechat:hover .wechat-qr,
    .contact-wechat:focus-visible .wechat-qr,
    .contact-wechat:focus-within .wechat-qr {
      display: block;
    }

    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div class="picker">
    <div class="picker-inner">
      <h1>请选择学习模块</h1>
      <p class="lead">先选一个模块，再进入章节学习和练习。</p>
      <div class="module-grid">
        <a class="module-card" href="/java/">
          <div class="module-name">Java <span>八股</span></div>
          <div class="module-sub">面试知识点与练习</div>
          <div class="module-count" id="javaCount"></div>
        </a>
        <a class="module-card" href="/agent/">
          <div class="module-name">Agent <span>与大模型</span></div>
          <div class="module-sub">Agent 与大模型知识点</div>
          <div class="module-count" id="agentCount"></div>
        </a>
      </div>
      <div class="contact-box">
        <div class="contact-title">联系作者</div>
        <div class="contact-actions">
          <button type="button" class="contact-btn contact-wechat" aria-label="微信，悬停查看二维码">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#07C160" d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.74 4.68L4 17l2.8-1.4c.84.24 1.74.38 2.7.4C9.16 15.37 9 14.71 9 14c0-3.87 3.8-7 8.5-7 .16 0 .33 0 .5.01C16.92 5.17 13.5 4 9.5 4zm-2 3.25a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm4 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM17.5 8C13.91 8 11 10.46 11 13.5S13.91 19 17.5 19c.84 0 1.64-.14 2.37-.38L22 19.5l-.66-1.74C22.41 16.7 23 15.16 23 13.5 23 10.46 20.09 8 17.5 8zm-1.75 3.25a.88.88 0 1 1 0 1.75.88.88 0 0 1 0-1.75zm3.5 0a.88.88 0 1 1 0 1.75.88.88 0 0 1 0-1.75z"/></svg>
            微信
            <span class="wechat-qr"><img src="/wechat-qr.jpg" alt="微信二维码"></span>
          </button>
          <a class="contact-btn" href="https://t.co/bwCfRWX0sg" target="_blank" rel="noopener noreferrer" aria-label="TG">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#26A5E4" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            TG
          </a>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function protectContent() {
      const block = (e) => e.preventDefault();
      ["copy", "cut", "contextmenu", "dragstart"].forEach((evt) => {
        document.addEventListener(evt, block, { capture: true });
      });
      document.addEventListener("keydown", (e) => {
        const key = (e.key || "").toLowerCase();
        if ((e.ctrlKey || e.metaKey) && ["c", "x"].includes(key)) e.preventDefault();
      }, { capture: true });
    })();

    function siteRoot() {
      let p = location.pathname || "/";
      if (p.endsWith("/index.html")) p = p.slice(0, -10);
      if (p.endsWith("/")) p = p.slice(0, -1);
      if (p.endsWith("/java") || p.endsWith("/agent")) p = p.slice(0, p.lastIndexOf("/"));
      return p;
    }
    (function bindPickerLinks() {
      const root = siteRoot();
      document.querySelectorAll("a.module-card").forEach((a) => {
        const href = a.getAttribute("href") || "";
        if (href === "/java/") a.setAttribute("href", root + "/java/");
        if (href === "/agent/") a.setAttribute("href", root + "/agent/");
      });
      const qr = document.querySelector(".contact-wechat img");
      if (qr) qr.setAttribute("src", root + "/wechat-qr.jpg");
    })();
    function knowledgeCount(data) {
      return (data.topics || []).filter((t) => t.categoryId !== "guide").length;
    }
    function fillCount(id, path) {
      fetch(path).then((res) => res.ok ? res.json() : null).then((data) => {
        if (!data) return;
        const n = knowledgeCount(data);
        const el = document.getElementById(id);
        if (el) el.textContent = n ? (n + " 篇知识点") : "";
      }).catch(() => {});
    }
    const root = siteRoot();
    if (window.BAGU_STATIC) {
      fillCount("javaCount", root + "/java/data/catalog.json");
      fillCount("agentCount", root + "/agent/data/catalog.json");
    } else {
      fillCount("javaCount", "/api/java/catalog");
      fillCount("agentCount", "/api/agent/catalog");
    }
  </script>
</body>
</html>
